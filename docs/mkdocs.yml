site_name: tkdeft开发文档
copyright: Copyright &copy; 2024 - 2025 XiangQinxi
site_url: https://tkdeft.netlify.app/

# 断链/断锚点默认只是 INFO，加了 --strict 也不会失败。
# 这里把锚点提到 warn：中文标题的锚点会被 slugify 成 #_1 这类，
# 显式写成 `## 标题 { #id }` 再链接才可靠（本仓库已全部改过）。
validation:
  links:
    anchors: warn
    absolute_links: warn

plugins:
  - search:
      lang: zh
  - offline
  # API 文档由源码的文档字符串自动生成（与 tkfluent 文档保持一致）
  - mkdocstrings:
      handlers:
        python:
          paths: [..]
          options:
            allow_inspection: true
  - blog:
      post_dir: "blog/posts"
  - rss:
      match_path: blog/posts/.*
      date_from_meta:
        as_creation: date
      categories:
        - categories
        - tags

theme:
  name: material  # 主题
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode

    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to system preference

  features:
    - navigation.footer  # Footer
    - content.tooltips  # ToolTip
    - blog  # Blog
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.indexes
  language: zh

markdown_extensions:
  - abbr
  - attr_list
  - md_in_html          # 让 <figure markdown> 里的 Markdown 语法生效（插图用）
  - pymdownx.snippets
  - def_list
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      # 注意：这里**刻意不配 mermaid**。Material 的 mermaid 支持是运行时从
      # unpkg CDN 拉脚本的，而本站启用了 offline 插件——离线打开时图会消失。
      # 流程图统一放在 docs/diagrams/*.mmd，由 gen_figures.py 预渲染成
      # docs/docs/assets/*.png，页面只引用图片（见 docs/README.md）。
      custom_fences: []
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - 主页: "index.md"
  - 开始:
      - 安装: "getstarted/install.md"
      - 快速上手: "getstarted/quickstart.md"
      - 概念与架构: "getstarted/concepts.md"
  - 指南:
      - 指南总览: "usage/index.md"
      - 绘制引擎: "usage/custom-drawing.md"
      - 自定义组件: "usage/custom-widget.md"
      - 回归与性能: "usage/benchmarks.md"
      - 常见问题与排查: "usage/faq.md"
      - 从 0.2 升级到 0.3: "usage/upgrade-0.3.md"
  - API:
      - api/index.md
      - 顶层:
          - api/tkdeft.md
      - 绘制引擎:
          - api/tkdeft.engines.md
          - api/tkdeft.engines.base.md
          - api/tkdeft.engines.cache.md
          - api/tkdeft.engines.colors.md
          - api/tkdeft.engines.skia_engine.md
          - api/tkdeft.engines.pillow_engine.md
          - api/tkdeft.engines.cairo_engine.md
      - 图形与画布:
          - api/tkdeft.svg.md
          - api/tkdeft.windows.md
          - api/tkdeft.windows.canvas.md
          - api/tkdeft.windows.draw.md
          - api/tkdeft.windows.drawwidget.md
      - 基础:
          - api/tkdeft.object.md
          - api/tkdeft.utility.md
  - 模板:
      - 什么是模板: "template/index.md"
  - 博客:
      - blog/index.md

extra_css:
  - stylesheets/extra.css

